# Babylon Local Development Stack
#
# This docker-compose file is for local development auxiliary services only.
# The primary database is EQLite which runs via Jeju.
#
# To start the full Babylon development environment:
#   1. Start Jeju: cd /path/to/jeju && bun run dev
#   2. Start Redis: docker-compose up redis -d
#   3. Start Babylon: bun run dev
#
# PostgreSQL is no longer used - all data is stored in EQLite.

services:
  redis:
    image: redis:7-alpine
    container_name: babylon-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --maxclients 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: babylon-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: babylon
      MINIO_ROOT_PASSWORD: babylon_dev_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local
