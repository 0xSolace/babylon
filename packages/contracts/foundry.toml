[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.33"
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

# Remappings for inlined dependencies
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.2.0/",
    "forge-std/=dependencies/forge-std-1.9.4/src/",
    "@jeju/contracts/=../../../../packages/contracts/src/",
]

# Test settings
verbosity = 2

[fuzz]
runs = 256

fs_permissions = [
    { access = "read-write", path = "./broadcast" },
    { access = "read", path = "./" }
]

# RPC endpoints
[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "https://1rpc.io/sepolia"
jeju_testnet = "${TESTNET_RPC}"
jeju_mainnet = "${MAINNET_RPC}"

# Etherscan API keys
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

