[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["dependencies"]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

# Remappings for OpenZeppelin
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.2.0/",
    "forge-std/=dependencies/forge-std-1.9.4/src/"
]

# RPC endpoints
[rpc_endpoints]
localnet = "http://127.0.0.1:6546"
anvil = "http://127.0.0.1:6545"
jeju_testnet = "${JEJU_TESTNET_RPC_URL}"
jeju_mainnet = "${JEJU_MAINNET_RPC_URL}"

# Etherscan verification (optional - set JEJU_EXPLORER_API_KEY env var)
# [etherscan]
# jeju_testnet = { key = "${JEJU_EXPLORER_API_KEY}", url = "https://explorer.testnet.jejunetwork.org/api" }
# jeju_mainnet = { key = "${JEJU_EXPLORER_API_KEY}", url = "https://explorer.jejunetwork.org/api" }
