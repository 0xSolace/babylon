# Babylon Training Pipeline Values
# Supports both CPU and GPU training configurations

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Common settings
common:
  enabled: true

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# CPU Training (data processing, ranking, benchmarking)
cpuTraining:
  enabled: true
  replicaCount: 1
  
  image:
    repository: babylon-training-cpu
    tag: latest
    pullPolicy: IfNotPresent
  
  command: ["serve"]
  
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  
  env:
    - name: NODE_ENV
      value: "production"
  
  envFrom:
    - secretRef:
        name: babylon-training-secrets
  
  service:
    type: ClusterIP
    port: 8080
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# GPU Training (GRPO, vLLM, model fine-tuning)
gpuTraining:
  enabled: false
  replicaCount: 1
  
  image:
    repository: babylon-training-gpu
    tag: latest
    pullPolicy: IfNotPresent
  
  command: ["serve"]
  
  # GPU resources
  resources:
    requests:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: 1
    limits:
      cpu: "8"
      memory: "64Gi"
      nvidia.com/gpu: 1
  
  # Toleration for GPU nodes
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  
  nodeSelector:
    gpu-type: "h200"
  
  env:
    - name: NODE_ENV
      value: "production"
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: MODEL_NAME
      value: "Qwen/Qwen2.5-3B-Instruct"
  
  envFrom:
    - secretRef:
        name: babylon-training-secrets
  
  service:
    type: ClusterIP
    port: 8080
    vllmPort: 8001

# Persistent storage for model checkpoints
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 100Gi
  
  # Mount paths
  checkpointPath: /app/checkpoints
  dataPath: /app/data

# Training jobs (CronJobs for scheduled training)
trainingJobs:
  # Daily trajectory extraction
  trajectoryExtraction:
    enabled: true
    schedule: "0 * * * *"  # Every hour
    command: ["extract"]
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
  
  # Daily benchmark
  benchmark:
    enabled: true
    schedule: "0 0 * * *"  # Daily at midnight
    command: ["benchmark"]
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
  
  # Weekly model training (GPU)
  weeklyTraining:
    enabled: false
    schedule: "0 0 * * 0"  # Weekly on Sunday
    command: ["train-atropos"]
    useGpu: true
    resources:
      requests:
        nvidia.com/gpu: 1

# Secrets reference
secrets:
  # Reference existing secret or create new
  existingSecret: ""
  # Values to create if existingSecret not set
  databaseUrl: ""
  openaiApiKey: ""
  huggingfaceToken: ""
  cronSecret: ""

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: training.babylon.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Health checks
healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

# Metrics
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
