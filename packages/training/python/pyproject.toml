[project]
name = "babylon-training"
version = "0.2.0"
description = "RL Training pipeline for Babylon agents using Atropos - Continuous MMO Edition"
authors = [
    {name = "Babylon Team"}
]
requires-python = ">=3.10"
dependencies = [
    "atroposlib>=0.1.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "litellm>=1.0.0",
    "PyYAML>=6.0.1",
    "tenacity>=8.2.0",
    "tabulate>=0.9.0",
    "tinker>=0.1.0",
    "vllm>=0.4.0",
    "wandb>=0.16.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
train-mmo = "scripts.train_mmo:main"
check-windows = "scripts.check_windows:main"
run-migrations = "scripts.run_migrations:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
