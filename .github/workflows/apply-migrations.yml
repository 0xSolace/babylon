name: Apply database migrations

on:
  push:
    branches:
      - staging
      - production

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply CQL migrations (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.STAGING_CQL_ENDPOINT }}
          CQL_DATABASE_ID: ${{ secrets.STAGING_CQL_DATABASE_ID }}
          CQL_PRIVATE_KEY: ${{ secrets.STAGING_CQL_PRIVATE_KEY }}
        run: bun run scripts/apply-cql-migrations.ts

      - name: Apply CQL migrations (production)
        if: github.ref == 'refs/heads/production'
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.PROD_CQL_ENDPOINT }}
          CQL_DATABASE_ID: ${{ secrets.PROD_CQL_DATABASE_ID }}
          CQL_PRIVATE_KEY: ${{ secrets.PROD_CQL_PRIVATE_KEY }}
        run: bun run scripts/apply-cql-migrations.ts
