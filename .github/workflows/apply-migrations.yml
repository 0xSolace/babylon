name: Apply database migrations

on:
  push:
    branches:
      - staging
      - production

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply EQLite migrations (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          EQLITE_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.STAGING_EQLITE_ENDPOINT }}
          EQLITE_DATABASE_ID: ${{ secrets.STAGING_EQLITE_DATABASE_ID }}
          EQLITE_PRIVATE_KEY: ${{ secrets.STAGING_EQLITE_PRIVATE_KEY }}
        run: bun run scripts/apply-eqlite-migrations.ts

      - name: Apply EQLite migrations (production)
        if: github.ref == 'refs/heads/production'
        env:
          EQLITE_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.PROD_EQLITE_ENDPOINT }}
          EQLITE_DATABASE_ID: ${{ secrets.PROD_EQLITE_DATABASE_ID }}
          EQLITE_PRIVATE_KEY: ${{ secrets.PROD_EQLITE_PRIVATE_KEY }}
        run: bun run scripts/apply-eqlite-migrations.ts
