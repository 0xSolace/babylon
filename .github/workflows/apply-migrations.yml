name: Apply database migrations

on:
  push:
    branches:
      - staging
      - production

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply SQLit migrations (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          SQLIT_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.STAGING_SQLIT_ENDPOINT }}
          SQLIT_DATABASE_ID: ${{ secrets.STAGING_SQLIT_DATABASE_ID }}
          SQLIT_PRIVATE_KEY: ${{ secrets.STAGING_SQLIT_PRIVATE_KEY }}
        run: bun run scripts/apply-sqlit-migrations.ts

      - name: Apply SQLit migrations (production)
        if: github.ref == 'refs/heads/production'
        env:
          SQLIT_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.PROD_SQLIT_ENDPOINT }}
          SQLIT_DATABASE_ID: ${{ secrets.PROD_SQLIT_DATABASE_ID }}
          SQLIT_PRIVATE_KEY: ${{ secrets.PROD_SQLIT_PRIVATE_KEY }}
        run: bun run scripts/apply-sqlit-migrations.ts
