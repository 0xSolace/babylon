# Local CI workflow optimized for act (local GitHub Actions runner)
# Run with: bun run test (or: act -W .github/workflows/local-ci.yml)
#
# This workflow uses CovenantQL (CQL) - decentralized database via Jeju.
# Works reliably on all platforms including Apple Silicon with act.
#
# NOTE: This workflow is designed to run locally via act. CQL services
# are accessed via the Jeju platform.

name: Local CI

on:
  workflow_dispatch:
  push:
    branches: [local-test]

env:
  NODE_ENV: test
  CI: true

jobs:
  local-ci:
    name: Local CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6391:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Determine service hosts
        id: services
        run: |
          # act uses host networking for the job container on macOS
          # Services expose ports to the host via port mapping
          if [ "$ACT" = "true" ]; then
            echo "Using act (local) networking"
            REDIS_HOST="host.docker.internal"
            REDIS_PORT="6391"
          else
            echo "Using GitHub Actions networking - localhost"
            REDIS_HOST="localhost"
            REDIS_PORT="6391"
          fi
          echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_OUTPUT
          echo "REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}" >> $GITHUB_OUTPUT
          echo "Service hosts: Redis=$REDIS_HOST:$REDIS_PORT"

      - name: Setup test environment
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
          JEJU_OAUTH3_SERVICE_URL: ${{ secrets.JEJU_OAUTH3_SERVICE_URL }}
          BABYLON_OAUTH3_APP_ID: ${{ secrets.BABYLON_OAUTH3_APP_ID }}
          OAUTH3_TEST_EMAIL: ${{ secrets.OAUTH3_TEST_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REDIS_URL: ${{ steps.services.outputs.REDIS_URL }}
          SKIP_E2E_CHECKS: true
        run: |
          echo "📋 Setting up test environment..."
          echo "   CQL_BLOCK_PRODUCER_ENDPOINT: $CQL_BLOCK_PRODUCER_ENDPOINT"
          echo "   REDIS_URL: $REDIS_URL"
          if [ -f scripts/ci/prepare-env.sh ]; then
            bash scripts/ci/prepare-env.sh
          else
            echo "NODE_ENV=test" > .env.test
            echo "CI=true" >> .env.test
            echo "CQL_BLOCK_PRODUCER_ENDPOINT=$CQL_BLOCK_PRODUCER_ENDPOINT" >> .env.test
            echo "CQL_DATABASE_ID=$CQL_DATABASE_ID" >> .env.test
            echo "REDIS_URL=$REDIS_URL" >> .env.test
          fi

      - name: Setup CQL Database
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
        run: |
          echo "🗄️ Setting up CQL database..."
          echo "   CQL_BLOCK_PRODUCER_ENDPOINT: $CQL_BLOCK_PRODUCER_ENDPOINT"
          bun run scripts/setup-test-cql.ts

      - name: Type Check
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          echo "📝 Running type check..."
          bun run typecheck

      - name: Lint
        run: |
          echo "✨ Running linter..."
          bun run lint

      - name: Build
        if: ${{ env.ACT != 'true' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          SKIP_ENV_VALIDATION: true
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
        run: |
          echo "🏗️ Building project..."
          bun run build
      
      - name: Skip Build (act)
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "⏭️ Skipping build in act (memory-intensive in emulation)"
          echo "   Build is verified separately via 'bun run build'"

      - name: Run Unit Tests
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
          REDIS_URL: ${{ steps.services.outputs.REDIS_URL }}
        run: |
          echo "🧪 Running unit tests..."
          bun test packages/testing/unit/ --preload ./packages/testing/unit/preload.ts

      - name: Run Integration Tests
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
          REDIS_URL: ${{ steps.services.outputs.REDIS_URL }}
          TEST_API_URL: http://localhost:3000
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🔗 Running integration tests..."
          bun test packages/testing/integration/ --preload ./packages/testing/integration/preload.ts

      - name: Summary
        run: |
          echo ""
          echo "================================"
          echo "✅ Local CI Pipeline Complete!"
          echo "================================"
          echo ""
          echo "Using CovenantQL (CQL) - decentralized database"
