name: Jeju Integration Tests

on:
  push:
    branches: [main, jeju]
  pull_request:
    branches: [main, jeju]
  workflow_dispatch:
    inputs:
      jeju_version:
        description: 'Jeju version to use'
        required: false
        default: 'latest'

env:
  NODE_ENV: test
  JEJU_NETWORK: localnet
  EQLITE_DATABASE_ID: babylon_test

jobs:
  jeju-integration:
    name: E2E Tests with Jeju
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Babylon
        uses: actions/checkout@v4
        with:
          path: babylon

      - name: Checkout Jeju
        uses: actions/checkout@v4
        with:
          repository: jejunetwork/jeju
          path: jeju
          token: ${{ secrets.JEJU_GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            babylon/node_modules
            jeju/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Jeju dependencies
        working-directory: jeju
        run: bun install

      - name: Install Babylon dependencies
        working-directory: babylon
        run: bun install

      - name: Start Jeju services
        working-directory: jeju
        run: |
          # Start Jeju in background
          bun run dev &
          JEJU_PID=$!
          echo "JEJU_PID=$JEJU_PID" >> $GITHUB_ENV

          # Wait for services to be ready
          echo "Waiting for Jeju services..."
          for i in {1..60}; do
            if curl -s http://localhost:4030/health > /dev/null; then
              echo "Jeju gateway is ready"
              break
            fi
            sleep 2
          done

          # Verify all services
          curl -s http://localhost:4030/v1/services || echo "Services check failed"

      - name: Deploy Babylon contracts to devnet
        working-directory: babylon
        env:
          PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
          RPC_URL: http://localhost:9545
        run: |
          cd packages/contracts
          forge script script/DeployBBLN.s.sol:DeployBBLN --rpc-url $RPC_URL --private-key $PRIVATE_KEY --broadcast || true

      - name: Run Jeju integration tests
        working-directory: babylon
        env:
          JEJU_GATEWAY_URL: http://localhost:4030
          JEJU_RPC_URL: http://localhost:9545
          EQLITE_BLOCK_PRODUCER_ENDPOINT: http://localhost:4661
          JEJU_CACHE_SERVICE_URL: http://localhost:4030/v1/cache
          JEJU_STORAGE_SERVICE_URL: http://localhost:4030/v1/storage
          JEJU_KMS_SERVICE_URL: http://localhost:4030/v1/kms
        run: |
          bun test packages/testing/integration/jeju-e2e.integration.test.ts

      - name: Run decentralized stack tests
        working-directory: babylon
        env:
          JEJU_GATEWAY_URL: http://localhost:4030
          EQLITE_BLOCK_PRODUCER_ENDPOINT: http://localhost:4661
        run: |
          bun test packages/testing/integration/decentralized-stack.integration.test.ts

      - name: Run messaging E2E tests
        working-directory: babylon
        env:
          JEJU_GATEWAY_URL: http://localhost:4030
        run: |
          bun test packages/testing/integration/messaging-e2e.integration.test.ts || true

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Jeju Gateway Logs ==="
          curl -s http://localhost:4030/v1/logs 2>/dev/null || echo "Could not get logs"

      - name: Stop Jeju services
        if: always()
        run: |
          kill ${{ env.JEJU_PID }} || true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
