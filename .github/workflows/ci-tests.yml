name: CI - Tests

on:
  pull_request:
    branches: [production, staging]
  push:
    branches: [production, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Debug - Check secret availability
        env:
          JEJU_OAUTH3_SERVICE_URL: ${{ secrets.JEJU_OAUTH3_SERVICE_URL }}
          BABYLON_OAUTH3_APP_ID: ${{ secrets.BABYLON_OAUTH3_APP_ID }}
          OAUTH3_TEST_EMAIL: ${{ secrets.OAUTH3_TEST_EMAIL }}
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
        run: |
          echo "🔐 Checking GitHub secrets availability..."
          echo ""
          echo "Secret Status:"
          if [ -n "$JEJU_OAUTH3_SERVICE_URL" ]; then
            echo "  ✅ JEJU_OAUTH3_SERVICE_URL: SET"
          else
            echo "  ❌ JEJU_OAUTH3_SERVICE_URL: NOT SET"
          fi
          
          if [ -n "$BABYLON_OAUTH3_APP_ID" ]; then
            echo "  ✅ BABYLON_OAUTH3_APP_ID: SET"
          else
            echo "  ❌ BABYLON_OAUTH3_APP_ID: NOT SET"
          fi
          
          if [ -n "$OAUTH3_TEST_EMAIL" ]; then
            echo "  ✅ OAUTH3_TEST_EMAIL: SET"
          else
            echo "  ❌ OAUTH3_TEST_EMAIL: NOT SET"
          fi

          if [ -n "$CQL_BLOCK_PRODUCER_ENDPOINT" ]; then
            echo "  ✅ TEST_CQL_ENDPOINT: SET"
          else
            echo "  ❌ TEST_CQL_ENDPOINT: NOT SET (required for CQL database)"
          fi
          
          echo ""
          if [ -z "$JEJU_OAUTH3_SERVICE_URL" ] && [ -z "$BABYLON_OAUTH3_APP_ID" ]; then
            echo "⚠️  WARNING: OAuth3 credentials not set!"
            echo "   E2E tests will fail without OAuth3 authentication."
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start Anvil
        run: |
          anvil --host 0.0.0.0 --port 8545 &
          echo "Waiting for Anvil..."
          timeout 30 bash -c 'until curl -s -H "Content-Type: application/json" -X POST --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}" http://localhost:8545; do sleep 1; done' || {
            echo "❌ Anvil failed to start"
            exit 1
          }
          echo "✅ Anvil is running"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Setup test environment
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
          JEJU_OAUTH3_SERVICE_URL: ${{ secrets.JEJU_OAUTH3_SERVICE_URL || '' }}
          BABYLON_OAUTH3_APP_ID: ${{ secrets.BABYLON_OAUTH3_APP_ID || '' }}
          OAUTH3_TEST_EMAIL: ${{ secrets.OAUTH3_TEST_EMAIL || '' }}
          OAUTH3_TEST_PHONE: ${{ secrets.OAUTH3_TEST_PHONE || '' }}
          OAUTH3_TEST_OTP: ${{ secrets.OAUTH3_TEST_OTP || '' }}
          OAUTH3_TEST_PASSWORD: ${{ secrets.OAUTH3_TEST_PASSWORD || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          FAL_KEY: ${{ secrets.FAL_KEY || '' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'test-cron-secret' }}
          WALLET_SEED_PHRASE: ${{ secrets.WALLET_SEED_PHRASE || '' }}
          WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD || '' }}
          REDIS_URL: redis://localhost:6379
        run: bash scripts/ci/prepare-env.sh

      - name: Setup CQL Database
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
        run: |
          set -euo pipefail
          echo "🗄️ Setting up CQL database..."
          bun run scripts/setup-test-cql.ts

      - name: Build production
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SKIP_ENV_VALIDATION: true
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          JEJU_OAUTH3_SERVICE_URL: ${{ secrets.JEJU_OAUTH3_SERVICE_URL || '' }}
          BABYLON_OAUTH3_APP_ID: ${{ secrets.BABYLON_OAUTH3_APP_ID || '' }}
        run: |
          set -euo pipefail
          echo "🏗️ Building production..."
          
          rm -rf dist
          
          echo "📋 Secret availability check:"
          echo "   JEJU_OAUTH3_SERVICE_URL: ${JEJU_OAUTH3_SERVICE_URL:+SET}${JEJU_OAUTH3_SERVICE_URL:-NOT SET}"
          echo "   BABYLON_OAUTH3_APP_ID: ${BABYLON_OAUTH3_APP_ID:+SET}${BABYLON_OAUTH3_APP_ID:-NOT SET}"
          
          echo "🔨 Running build..."
          bunx turbo build --filter=!babylon-docs
          echo "✅ Build complete"

      - name: Start production server
        run: |
          echo "🚀 Starting production server..."
          SKIP_ENV_VALIDATION=1 bun scripts/validation/check-environment.ts || echo "⚠️  Environment check skipped in CI"
          cd apps/web && bun run start > /tmp/prod-server.log 2>&1 &
          echo $! > /tmp/prod-server.pid
          echo "📝 Server PID: $(cat /tmp/prod-server.pid)"

          echo "⏳ Waiting for server to be ready..."
          timeout 360 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done' || {
            echo "❌ Server failed to respond within 360s. Logs:"
            if [ -f /tmp/prod-server.log ]; then
              tail -n 200 /tmp/prod-server.log
            fi
            exit 1
          }
          echo "✅ Production server is ready"
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          CQL_DATABASE_ID: test_babylon
          REDIS_URL: redis://localhost:6379
          DEPLOYMENT_ENV: localnet
          NODE_ENV: production
          PORT: 3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          JEJU_OAUTH3_SERVICE_URL: ${{ secrets.JEJU_OAUTH3_SERVICE_URL || '' }}
          BABYLON_OAUTH3_APP_ID: ${{ secrets.BABYLON_OAUTH3_APP_ID || '' }}

      - name: Run Synpress Tests (Wallet E2E)
        run: cd packages/testing && bunx playwright test --config=synpress.config.ts --reporter=list,json
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          WALLET_SEED_PHRASE: ${{ secrets.WALLET_SEED_PHRASE || '' }}
          WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD || '' }}
          OAUTH3_TEST_EMAIL: ${{ secrets.OAUTH3_TEST_EMAIL || '' }}
          OAUTH3_TEST_PHONE: ${{ secrets.OAUTH3_TEST_PHONE || '' }}
          OAUTH3_TEST_OTP: ${{ secrets.OAUTH3_TEST_OTP || '' }}
          OAUTH3_TEST_PASSWORD: ${{ secrets.OAUTH3_TEST_PASSWORD || '' }}
          CI: true
          NODE_ENV: test

      - name: Run E2E Tests (Standard)
        if: success() || failure()
        run: cd packages/testing && bunx playwright test e2e --reporter=list,json
        env:
          CQL_BLOCK_PRODUCER_ENDPOINT: ${{ secrets.TEST_CQL_ENDPOINT }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          OAUTH3_TEST_EMAIL: ${{ secrets.OAUTH3_TEST_EMAIL || '' }}
          OAUTH3_TEST_PASSWORD: ${{ secrets.OAUTH3_TEST_PASSWORD || '' }}
          CI: true
          NODE_ENV: test

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/prod-server.pid ]; then
            PID=$(cat /tmp/prod-server.pid)
            echo "🛑 Stopping production server (PID: $PID)..."
            kill "$PID" || true
            wait "$PID" || true
            rm /tmp/prod-server.pid
          fi

          if [ -f /tmp/prod-server.log ]; then
            echo "📝 Production server logs (last 100 lines):"
            tail -n 100 /tmp/prod-server.log || true
          fi
